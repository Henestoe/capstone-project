---
- name: Prepare all cluster nodes
  hosts: k3s_cluster
  become: true
  serial: 1

  roles:
    - common
    - security

- name: Configure the control plane
  hosts: k3s_server
  become: true

  roles:
    - k3s_server

- name: Configure the workers
  hosts: k3s_agents
  become: true
  serial: 1

  roles:
    - k3s_agent
