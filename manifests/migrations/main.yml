apiVersion: batch/v1
kind: Job
metadata:
  name: taskapp-migrations
  namespace: taskapp
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation

spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300

  template:
    metadata:
      labels:
        app: taskapp-migrations

    spec:
      restartPolicy: Never

      containers:
        - name: migrations
          image: ghcr.io/ts-a-devops/taskapp-backend:5d6b8fc
          imagePullPolicy: IfNotPresent

          command: ["alembic"]
          args: ["upgrade", "head"]

          envFrom:
            - configMapRef:
                name: taskapp-config
            - secretRef:
                name: taskapp-secrets

          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskapp-secrets
                  key: POSTGRES_PASSWORD

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
