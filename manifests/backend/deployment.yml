apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: taskapp
  annotations:
    argocd.argoproj.io/sync-wave: "2"

spec:
  replicas: 2
  minReadySeconds: 5

  selector:
    matchLabels:
      app: backend

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: backend

    spec:
      terminationGracePeriodSeconds: 60

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: backend

      containers:
        - name: backend
          image: ghcr.io/ts-a-devops/taskapp-backend:5d6b8fc
          imagePullPolicy: IfNotPresent

          command: ["gunicorn"]
          args:
            - "--workers"
            - "3"
            - "--bind"
            - "0.0.0.0:5000"
            - "--access-logfile"
            - "-"
            - "run:app"

          ports:
            - name: http
              containerPort: 5000

          envFrom:
            - configMapRef:
                name: taskapp-config
            - secretRef:
                name: taskapp-secrets
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskapp-secrets
                  key: POSTGRES_PASSWORD

          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

